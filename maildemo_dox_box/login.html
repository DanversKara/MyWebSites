<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · BearerMail</title>

<style>
  body { display:flex; align-items:center; justify-content:center; padding:16px; }
  .login-card { width:100%; max-width:400px; background:var(--card-bg); border:1px solid var(--border-color);
                border-radius:18px; padding:34px; box-shadow:0 6px 28px rgba(0,0,0,.08); }
  .brand { font-family:'Satisfy', cursive; color:var(--brand-color); font-size:2.2rem; text-align:center; }
</style>

<body>
<div style="position:fixed; top:0; left:0; right:0;">
  <div class="demo-chrome">

  <div style="margin:22px 0 6px;">

    <input class="input" type="password" value="············" style="margin-top:6px;">

  <label class="small text-muted" style="display:block; margin:10px 0 16px;"><input type="checkbox" checked> Keep me signed in</label>
  <a class="btn btn-primary btn-lg btn-block" href="mail.html"><i class="bi bi-box-arrow-in-right"></i> Sign in</a>
