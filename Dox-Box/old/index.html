<meta charset="utf-8" />

<script>
  try {
    const s = localStorage.getItem('theme');
    document.documentElement.dataset.theme =
      s || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
</script>
<style>
  :root{
    --bg:#0a0c11;--glow1:rgba(88,120,255,.18);--glow2:rgba(255,90,180,.12);
    --card:rgba(255,255,255,.045);--card-hi:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.08);--border-hi:rgba(255,255,255,.2);
    --text:#e9ecf3;--muted:#858da3;
  }
  html[data-theme="light"]{
    --bg:#f4f5f8;--glow1:rgba(120,150,255,.28);--glow2:rgba(255,140,200,.22);
    --card:rgba(255,255,255,.72);--card-hi:#ffffff;
    --border:rgba(10,15,40,.08);--border-hi:rgba(10,15,40,.18);
    --text:#151a24;--muted:#6b7385;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    color:var(--text);background:var(--bg);
    background-image:
      radial-gradient(60rem 40rem at 15% -10%, var(--glow1), transparent 60%),
      radial-gradient(50rem 35rem at 90% 0%, var(--glow2), transparent 55%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:44px 20px 64px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:30px}
  #time{font-size:2.4rem;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
  #date{color:var(--muted);font-size:13.5px;margin-top:2px}
  #themeBtn{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;
    border-radius:11px;border:1px solid var(--border);background:var(--card);
    color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
  #themeBtn:hover{background:var(--card-hi);color:var(--text);border-color:var(--border-hi)}
  #themeBtn svg{width:17px;height:17px;display:block}
  .search{margin-bottom:30px}
  .search input{width:100%;padding:14px 16px;font-size:16px;font-family:inherit;
    border-radius:14px;border:1px solid var(--border);background:var(--card);
    color:var(--text);outline:none;transition:border-color .15s,background .15s;}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--border-hi);background:var(--card-hi)}
  #hint{height:18px;margin:7px 2px 0;font-size:12.5px;color:var(--muted)}
  .group{margin-bottom:26px}
  .group[hidden]{display:none}
  .group h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;
    color:var(--muted);margin:0 0 10px 2px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
  .tile{display:flex;align-items:center;gap:11px;min-width:0;
    padding:10px 13px;border-radius:12px;background:var(--card);border:1px solid var(--border);
    color:inherit;text-decoration:none;transition:transform .12s ease,background .12s,border-color .12s;}
  .tile[hidden]{display:none}
  .tile:hover,.tile:focus-visible{background:var(--card-hi);border-color:var(--border-hi);
    transform:translateY(-2px);outline:none;}
  .tile:active{transform:translateY(0)}
  .icon{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;
    overflow:hidden;font-size:12px;font-weight:700;color:#fff;}
  .icon img{width:100%;height:100%;object-fit:contain;display:block}
  .tile .text{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
  .tile .label{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .desc{font-size:11.5px;line-height:1.35;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile.has-choices::after{content:'';width:5px;height:5px;border-radius:50%;
    background:currentColor;opacity:.35;flex:0 0 5px;}
  footer{margin-top:38px;color:var(--muted);font-size:12.5px;text-align:center}
  kbd{font:inherit;font-size:11.5px;padding:1px 5px;border-radius:5px;
    border:1px solid var(--border);background:var(--card);}
  footer .quote{margin:16px auto 0;max-width:52ch;font-size:12px;line-height:1.5;
    color:var(--muted);opacity:.85;}
  footer .quote span{display:block;margin-top:3px;font-size:11px;opacity:.75;}
  footer .foot-links{display:flex;gap:6px 14px;justify-content:center;align-items:center;
    flex-wrap:wrap;margin-bottom:16px;}
  footer .foot-links a{color:var(--muted);text-decoration:none;font-size:12.5px;
    transition:color .15s;}
  footer .foot-links a:hover{color:var(--text);text-decoration:underline;
    text-underline-offset:3px;}
  footer .foot-links .sep{opacity:.35;font-size:11px;}

  /* chooser modal */
  .chooser{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;
    background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    animation:fadeIn .14s ease;}
  .chooser[hidden]{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
  html[data-theme="light"] .chooser{background:rgba(20,25,45,.45)}
  .chooser-card{background:var(--bg);border:1px solid var(--border-hi);border-radius:18px;
    padding:22px;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,.55);
    animation:popIn .18s cubic-bezier(.2,.9,.3,1.1);}
  .chooser-title{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;}
  .chooser-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  .chooser-options{display:grid;gap:8px}
  .chooser-option{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;
    border:1px solid var(--border);background:var(--card);color:inherit;font:inherit;
    text-align:left;cursor:pointer;transition:background .13s,border-color .13s,transform .1s;}
  .chooser-option:hover{background:var(--card-hi);border-color:var(--border-hi)}
  .chooser-option:active{transform:scale(.985)}
  .chooser-option .opt-label{font-size:14px;font-weight:500;line-height:1.3;}
  .chooser-option .opt-hint{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3;}
  .chooser-option .opt-emoji{flex:0 0 30px;width:30px;height:30px;border-radius:8px;
    display:grid;place-items:center;background:var(--card-hi);font-size:15px;}
  .chooser-cancel{margin-top:14px;width:100%;padding:11px;border-radius:11px;
    border:1px solid var(--border);background:transparent;color:var(--muted);
    font:inherit;font-size:13.5px;cursor:pointer;transition:background .13s,color .13s;}
  .chooser-cancel:hover{background:var(--card);color:var(--text)}
  @media (max-width:520px){
    .wrap{padding-top:30px}
    #time{font-size:1.9rem}
    .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
  }
</style>

/* ---------- platform detection ---------- */
const isAndroid = /android/i.test(navigator.userAgent);
const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function pickPlatformUrl(choice) {
  if (isAndroid && choice.android) return choice.android;
  if (isIOS && choice.ios)         return choice.ios;
  return choice.url;
}

/* ---------- force-browser (defeat App Links hijack) ---------- */
let _browserPkg = null;
(function initBrowserDetect() {
  const ua = navigator.userAgent || "";
  if (/SamsungBrowser/i.test(ua))      { _browserPkg = "com.sec.android.app.sbrowser"; return; }
  if (/EdgA/i.test(ua))                { _browserPkg = "com.microsoft.emmx"; return; }
  if (/Firefox/i.test(ua))            { _browserPkg = "org.mozilla.firefox"; return; }
  if (/Opera Mini|Opera Mobi|OPR\//i.test(ua)) { _browserPkg = "com.opera.browser"; return; }
  if (navigator.brave && navigator.brave.isBrave) {
    navigator.brave.isBrave().then(b => { _browserPkg = b ? "com.brave.browser" : "com.android.chrome"; })
      .catch(() => { _browserPkg = "com.android.chrome"; });
  } else {
    _browserPkg = "com.android.chrome";
  }
})();
function forceBrowserIntent(httpsUrl) {
  const u = new URL(httpsUrl);
  const pkg = _browserPkg || "com.android.chrome";
  const fallback = encodeURIComponent(httpsUrl);
  return `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=${u.protocol.replace(":", "")};package=${pkg};S.browser_fallback_url=${fallback};end`;
}

function hashHue(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}
function faviconFor(url){
  try {
    let targetUrl = url;
    if (url.startsWith('ext+container://')) {
        const m = url.match(/ext\+container:\/\/[^\/]+\/(.*)/);
        if (m && m[1]) targetUrl = m[1];
    }
    const h = new URL(targetUrl).hostname;
    if (/^(\d{1,3}\.){3}\d{1,3}$/.test(h) || h === 'localhost' || !h.includes('.') || /\.box$/.test(h)) return null;
    return `https://www.google.com/s2/favicons?domain=${h}&sz=64`;
  } catch (e) { return null; }
}
function makeIcon(link){
  const box = document.createElement('span');
  box.className = 'icon';
  const g = GLYPHS[link.glyph || GLYPH_FOR[link.name]];
  if (g) {
    box.style.background = `linear-gradient(135deg, hsl(${g.h} 62% 55%), hsl(${g.h} 62% 38%))`;
    box.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + g.p + '</svg>';
  } else {
    box.style.background = `hsl(${hashHue(link.url)} 52% 42%)`;
    box.textContent = (link.name.trim()[0] || '?').toUpperCase();
  }
  if (link.icon !== false) {
    const src = typeof link.icon === 'string' ? link.icon : faviconFor(link.url);
    if (src) {
      const img = new Image();
      img.alt = ''; img.decoding = 'async';
      img.onload = () => { box.textContent = ''; box.style.background = 'transparent'; box.appendChild(img); };
      img.src = src;
    }
  }
  return box;
}

/* ---------- Android app launching ---------- */
/* ONE intent per tap. Chrome/Firefox follow S.browser_fallback_url the
   moment the intent can't be handled, so chaining several intents
   (old behaviour) always ended on the web page after the first miss.

   The app must expose a BROWSABLE intent filter for this to work:
     - androidScheme { scheme, path }  -> app's own custom scheme (best for LAN/IP apps)
     - otherwise the https URL, which needs a verified App Link
   If the app can't take it, the browser opens webUrl (no Play Store). */
function launchAndroid(pkgs, webUrl, schemeHint, freshStart) {
  const pkg = Array.isArray(pkgs) ? pkgs[0] : pkgs;
  // freshStart: ask Android to restart the app's task instead of handing a new
  // link to a running copy (NEW_TASK | CLEAR_TASK = 0x10008000). For apps that
  // crash when a link arrives while they are already open (Home Assistant).
  const fb  = (freshStart ? 'launchFlags=0x10008000;' : '') +
              'S.browser_fallback_url=' + encodeURIComponent(webUrl);
  let target;
  if (schemeHint && schemeHint.scheme) {
    target = 'intent://' + (schemeHint.path || '') + '#Intent;scheme=' + schemeHint.scheme +
             ';package=' + pkg + ';' + fb + ';end';
  } else {
    let u; try { u = new URL(webUrl); } catch (e) { window.location.href = webUrl; return; }
    target = 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=' +
             u.protocol.replace(':', '') + ';package=' + pkg + ';' + fb + ';end';
  }
  window.location.href = target;
}

/* ---------- navigation ---------- */
function openUrl(url, fallback, forceBrowser) {
  if (forceBrowser && isAndroid && /^https?:/i.test(url)) {
    window.location.href = forceBrowserIntent(url);
    return;
  }
  if (url.startsWith('ext+container://')) {
    const m = url.match(/ext\+container:\/\/[^\/]+\/(.*)/);
    const realUrl = m ? m[1] : null;
    const isBrave = !!(navigator.brave && navigator.brave.isBrave);
    if (!isBrave) { window.location.href = realUrl || url; return; }
    tryCustom(url, realUrl);
    return;
  }
  if (!/^https?:/i.test(url)) {
    tryCustom(url, fallback || null);
    return;
  }
  window.location.href = url;
}

function tryCustom(schemeUrl, fallbackUrl) {
  let didLeave = false;
  const mark = () => { didLeave = true; };
  window.addEventListener('blur', mark, { once: true });
  const onVis = () => { if (document.hidden) mark(); };
  document.addEventListener('visibilitychange', onVis, { once: true });

  try { window.location.href = schemeUrl; } catch (e) {}

  setTimeout(() => {
    if (!didLeave && fallbackUrl) {
      window.removeEventListener('blur', mark);
      document.removeEventListener('visibilitychange', onVis);
      window.location.href = fallbackUrl;
    }
  }, 900);
}

/* ---------- hot air balloon game ---------- */
function openBalloonGame() {
  if (document.getElementById('balloon-ov')) return;
  const ov = document.createElement('div');
  ov.id = 'balloon-ov';
  ov.innerHTML = '<div id="balloon-hud"><span id="balloon-score">0</span>' +
    '<button id="balloon-close" aria-label="Close">\u2715</button></div>' +
    '<canvas id="balloon-cv"></canvas><div id="balloon-msg"></div>';
  document.body.appendChild(ov);

  const cv = ov.querySelector('#balloon-cv');
  const ctx = cv.getContext('2d');
  const scoreEl = ov.querySelector('#balloon-score');
  const msgEl = ov.querySelector('#balloon-msg');
  let W, H, raf;

  function resize() { W = cv.width = ov.clientWidth; H = cv.height = ov.clientHeight; }

  const balloon = { x: 0, y: 0, vy: 0, r: 26 };
  let thrust = false, clouds = [], stars = [], score = 0, dist = 0, speed = 2.2, running = true, t = 0;

  function reset() {
    balloon.x = Math.max(80, W * 0.28); balloon.y = H / 2; balloon.vy = 0;
    clouds = []; stars = []; score = 0; dist = 0; speed = 2.2; running = true; t = 0;
    msgEl.style.display = 'none'; msgEl.innerHTML = '';
  }

  function spawnCloud() {
    const gapH = 120 + Math.random() * 60;
    const gapY = 70 + Math.random() * Math.max(50, H - 140 - gapH);
    clouds.push({ x: W + 60, w: 64 + Math.random() * 36, gapY, gapH, passed: false });
  }
  function spawnStar() {
    stars.push({ x: W + 30, y: 50 + Math.random() * Math.max(50, H - 100), r: 11, taken: false });
  }

  function drawStar(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function update() {
    t++;
    balloon.vy += thrust ? -0.55 : 0.38;
    balloon.vy *= 0.985;
    balloon.vy = Math.max(-9, Math.min(9, balloon.vy));
    balloon.y += balloon.vy;
    if (balloon.y < balloon.r) { balloon.y = balloon.r; balloon.vy = 0; }
    if (balloon.y > H - balloon.r - 26) { balloon.y = H - balloon.r - 26; balloon.vy = 0; }
    if (t % 95 === 0) spawnCloud();
    if (t % 150 === 0) spawnStar();
    speed = 2.2 + dist / 9000;

    const bx = balloon.x, by = balloon.y, r = balloon.r * 0.8;
    for (const c of clouds) {
      c.x -= speed;
      if (!c.passed && c.x + c.w < bx) { c.passed = true; score += 1; }
      if (bx + r > c.x && bx - r < c.x + c.w && (by - r < c.gapY || by + r > c.gapY + c.gapH)) {
        gameOver(); return;
      }
    }
    for (const s of stars) {
      s.x -= speed;
      if (!s.taken) {
        const dx = s.x - bx, dy = s.y - by;
        if (dx * dx + dy * dy < (s.r + balloon.r) * (s.r + balloon.r)) { s.taken = true; score += 10; }
      }
    }
    clouds = clouds.filter(c => c.x + c.w > -80);
    stars = stars.filter(s => s.x > -40 && !s.taken);
    dist += speed;
    scoreEl.textContent = score + Math.floor(dist / 100);
  }

  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#6ec1f5'); g.addColorStop(1, '#e8f7ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffdf6b';
    ctx.beginPath(); ctx.arc(W - 70, 70, 32, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffb700';
    for (const s of stars) drawStar(s.x, s.y, s.r);
    for (const c of clouds) {
      ctx.fillStyle = '#ffffff';
      rr(c.x, -12, c.w, c.gapY + 12, 16); ctx.fill();
      rr(c.x, c.gapY + c.gapH, c.w, H - (c.gapY + c.gapH) + 12, 16); ctx.fill();
      ctx.fillStyle = 'rgba(170,200,225,.55)';
      rr(c.x, -12, 13, c.gapY + 12, 7); ctx.fill();
      rr(c.x, c.gapY + c.gapH, 13, H - (c.gapY + c.gapH) + 12, 7); ctx.fill();
    }
    const bx = balloon.x, by = balloon.y;
    ctx.strokeStyle = '#8a6d3b'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx - 13, by + 16); ctx.lineTo(bx - 8, by + 42);
    ctx.moveTo(bx + 13, by + 16); ctx.lineTo(bx + 8, by + 42);
    ctx.stroke();
    ctx.fillStyle = '#a0713d';
    rr(bx - 10, by + 42, 20, 15, 3); ctx.fill();
    const eg = ctx.createLinearGradient(bx - 26, by - 32, bx + 26, by + 18);
    eg.addColorStop(0, '#ff6b6b'); eg.addColorStop(0.5, '#ff9f43'); eg.addColorStop(1, '#ee5253');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.ellipse(bx, by - 4, 26, 30, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(bx, by - 4, 10, 30, 0, 0, 7); ctx.fill();
    if (thrust) {
      ctx.fillStyle = '#ffd32a';
      ctx.beginPath();
      ctx.moveTo(bx - 6, by + 42); ctx.lineTo(bx + 6, by + 42); ctx.lineTo(bx, by + 28);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#7fbf6a'; ctx.fillRect(0, H - 24, W, 24);
  }

  function gameOver() {
    running = false;
    const final = score + Math.floor(dist / 100);
    msgEl.innerHTML = '\uD83D\uDCA5 Popped!<br><span>Score: ' + final + '</span><br><button id="balloon-retry">Fly again</button>';
    msgEl.style.display = 'flex';
    ov.querySelector('#balloon-retry').addEventListener('click', e => { e.stopPropagation(); reset(); });
  }

  function loop() { if (running) update(); draw(); raf = requestAnimationFrame(loop); }

  function close() {
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', resize);
    window.removeEventListener('keydown', keyH);
    window.removeEventListener('keyup', keyH);
    ov.remove();
  }
  function keyH(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); thrust = (e.type === 'keydown'); }
    if (e.code === 'Escape') close();
  }

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', keyH);
  window.addEventListener('keyup', keyH);
  ov.addEventListener('pointerdown', e => { e.preventDefault(); thrust = true; });
  ov.addEventListener('pointerup', e => { e.preventDefault(); thrust = false; });
  ov.addEventListener('pointercancel', () => { thrust = false; });
  ov.addEventListener('pointerleave', () => { thrust = false; });
  ov.querySelector('#balloon-close').addEventListener('click', e => { e.stopPropagation(); close(); });
  reset();
  loop();
}

/* ---------- chooser modal ---------- */
function openChooser(link) {
  chooserTitle.textContent = link.name;
  chooserOptions.innerHTML = '';

  link.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chooser-option';

    if (choice.emoji) {
      const em = document.createElement('span');
      em.className = 'opt-emoji';
      em.textContent = choice.emoji;
      btn.appendChild(em);
    }

    const textWrap = document.createElement('span');
    textWrap.style.display = 'flex';
    textWrap.style.flexDirection = 'column';
    textWrap.style.minWidth = '0';

    const lbl = document.createElement('span');
    lbl.className = 'opt-label';
    lbl.textContent = choice.label;
    textWrap.appendChild(lbl);

    if (choice.hint) {
      const hint = document.createElement('span');
      hint.className = 'opt-hint';
      hint.textContent = choice.hint;
      textWrap.appendChild(hint);
    }
    btn.appendChild(textWrap);

    btn.addEventListener('click', () => {
      closeChooser();
      if (isAndroid && choice.androidPkg) {
        setTimeout(() => launchAndroid(choice.androidPkg, choice.url, choice.androidScheme, choice.freshStart), 40);
        return;
      }
      const chosenUrl = pickPlatformUrl(choice);
      setTimeout(() => openUrl(chosenUrl, choice.fallback, choice.forceBrowser), 40);
    });

    chooserOptions.appendChild(btn);
  });

  chooserEl.hidden = false;
}

function closeChooser() { chooserEl.hidden = true; }

chooserCancel.addEventListener('click', closeChooser);
chooserEl.addEventListener('click', (e) => { if (e.target === chooserEl) closeChooser(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !chooserEl.hidden) { e.stopPropagation(); closeChooser(); }
});

/* ---------- render ---------- */
for (const group of CONFIG.groups) {
  const g = document.createElement('section');
  g.className = 'group';

  const h = document.createElement('h2');
  h.textContent = group.title;
  g.appendChild(h);

  const grid = document.createElement('div');
  grid.className = 'grid';

  for (const link of group.links) {
    const a = document.createElement('a');
    a.className = 'tile';
    if (link.choices && link.choices.length) a.classList.add('has-choices');

    a.href = link.url;
    a.title = link.desc ? link.url + '\n' + link.desc : link.url;
    a.dataset.name = link.name;

    let searchBlob = (link.name + ' ' + (link.desc || '') + ' ' + link.url).toLowerCase();
    if (link.choices) {
      for (const c of link.choices) searchBlob += ' ' + (c.label || '') + ' ' + (c.url || '');
    }
    a.dataset.search = searchBlob;

    const text = document.createElement('span');
    text.className = 'text';

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = link.name;
    text.appendChild(label);

    if (link.desc) {
      const desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = link.desc;
      text.appendChild(desc);
    }

    a.append(makeIcon(link), text);

    a.addEventListener('click', function(e) {
      if (link.game === 'balloon') {
        e.preventDefault();
        openBalloonGame();
        return;
      }
      if (link.choices && link.choices.length) {
        e.preventDefault();
        openChooser(link);
        return;
      }
      // Platform-specific overrides first (e.g. Android app intent)
      if (isAndroid && link.androidPkg) {
        e.preventDefault();
        launchAndroid(link.androidPkg, link.url, link.androidScheme, link.freshStart);
        return;
      }
      if (isAndroid && link.android) {
        e.preventDefault();
        openUrl(link.android, link.fallback);
        return;
      }
      if (isIOS && link.ios) {
        e.preventDefault();
        openUrl(link.ios, link.fallback);
        return;
      }
      if (link.url.startsWith('ext+container://')) {
        e.preventDefault();
        openUrl(link.url);
      }
    });

    grid.appendChild(a);
  }

  g.appendChild(grid);
  groupsEl.appendChild(g);
}

/* ---------- filter / search ---------- */
function applyFilter(){
  const val = q.value.trim().toLowerCase();
  let first = null;

  document.querySelectorAll('.group').forEach(g => {
    let any = false;
    g.querySelectorAll('.tile').forEach(t => {
      const hit = !val || t.dataset.search.includes(val);
      t.hidden = !hit;
      if (hit) { any = true; if (!first) first = t; }
    });
    g.hidden = !any;
  });

  hintEl.textContent = val
    ? (first ? '↵  ' + first.dataset.name : '↵  Search the web for “' + q.value.trim() + '”')
    : '';
}

q.addEventListener('input', applyFilter);

q.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = [...document.querySelectorAll('.tile')].find(t => !t.hidden);
    if (first) { first.click(); return; }
    const val = q.value.trim();
    if (val) location.href = CONFIG.search + encodeURIComponent(val);
  }
  if (e.key === 'Escape') { q.value = ''; applyFilter(); q.blur(); }
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) {
    e.preventDefault();
    q.focus();
    q.select();
  }
});

/* ---------- clock ---------- */
function tick(){
  const d = new Date();
  timeEl.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  dateEl.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
tick();
setInterval(tick, 10000);

/* ---------- theme ---------- */
const SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

function paintThemeBtn(){
  const dark = root.dataset.theme === 'dark';
  themeBtn.innerHTML = dark ? SUN : MOON;
  themeBtn.title = dark ? 'Switch to light' : 'Switch to dark';
}
themeBtn.addEventListener('click', () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  paintThemeBtn();
});
paintThemeBtn();
</script>
