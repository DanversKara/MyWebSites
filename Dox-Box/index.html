<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOX BOX — Moved to start.dox.box</title>
<meta name="description" content="The DOX BOX startpage has moved. Redirecting to start.dox.box.">
<meta http-equiv="refresh" content="8;url=https://start.dox.box">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cyan: #2ee6ff;
    --amber: #ffb347;
    --ink: #eaf6ff;
    --dim: rgba(234,246,255,.55);
  }
  html, body { height: 100%; }
  body {
    background: #04060c;
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* ambient glows */
  .glow { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5; pointer-events: none; }
  .glow.a { width: 55vmax; height: 55vmax; background: #0e4b5c; top: -20vmax; left: -15vmax; animation: drift 14s ease-in-out infinite alternate; }
  .glow.b { width: 45vmax; height: 45vmax; background: #4a2c05; bottom: -18vmax; right: -12vmax; animation: drift 18s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(4vmax,3vmax) scale(1.12); } }

  /* particle canvas */
  #stars { position: fixed; inset: 0; }

  /* perspective grid floor */
  .floor {
    position: fixed; left: -25%; right: -25%; bottom: -12%; height: 46%;
    background:
      linear-gradient(transparent 0%, rgba(4,6,12,.9) 92%),
      repeating-linear-gradient(90deg, rgba(46,230,255,.20) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(0deg,  rgba(46,230,255,.20) 0 1px, transparent 1px 42px);
    transform: perspective(340px) rotateX(64deg);
    transform-origin: bottom;
    animation: roll 1.6s linear infinite;
    mask-image: linear-gradient(to top, black 55%, transparent 98%);
    -webkit-mask-image: linear-gradient(to top, black 55%, transparent 98%);
  }
  @keyframes roll { from { background-position: 0 0, 0 0, 0 0; } to { background-position: 0 0, 0 0, 0 42px; } }

  /* scanlines */
  .scan { position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
  .sweep { position: fixed; left: 0; right: 0; height: 120px; top: -120px; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(46,230,255,.05), transparent);
    animation: sweep 7s linear infinite; }
  @keyframes sweep { to { transform: translateY(120vh); } }

  /* card */
  .card {
    position: relative; z-index: 3; text-align: center;
    max-width: 620px; width: calc(100% - 40px);
    padding: 44px 40px 34px;
    background: rgba(8,12,22,.62);
    border: 1px solid rgba(46,230,255,.25);
    border-radius: 18px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 24px 80px rgba(0,0,0,.55), 0 0 44px rgba(46,230,255,.08) inset;
    animation: rise .8s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
  .card::before, .card::after {
    content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid var(--cyan); opacity: .8;
  }
  .card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
  .card::after  { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }

  .kicker {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 11px; letter-spacing: .34em; color: var(--amber);
    text-transform: uppercase; margin-bottom: 14px;
  }
  .kicker .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #38f07a; margin-right: 10px; vertical-align: 1px;
    box-shadow: 0 0 10px #38f07a; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  h1 {
    font-size: clamp(52px, 11vw, 92px); font-weight: 800; letter-spacing: .04em; line-height: 1;
    background: linear-gradient(180deg, #ffffff 20%, #9fdcff 55%, #1d7ea8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    position: relative; display: inline-block;
    filter: drop-shadow(0 0 22px rgba(46,230,255,.35));
  }
  h1 .shine {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.75) 50%, transparent 58%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 260% 100%; animation: shine 3.8s ease-in-out infinite;
  }
  @keyframes shine { 0%,55% { background-position: 130% 0; } 90%,100% { background-position: -130% 0; } }

  .moved { margin-top: 12px; font-size: clamp(16px, 3.4vw, 20px); color: var(--ink); }
  .moved b { color: var(--cyan); font-weight: 700; }

  .term {
    margin: 26px auto 6px; text-align: left; max-width: 470px;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 12.5px; line-height: 1.95; color: #9fe8b1;
    background: rgba(0,0,0,.38); border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px; padding: 13px 16px; min-height: 118px;
  }
  .term .p { color: var(--cyan); }
  .term .ok { color: #38f07a; }
  .term .amber { color: var(--amber); }
  .term .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caret::after { content: "▋"; color: var(--cyan); animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,.10);
    max-width: 470px; margin: 18px auto 0; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--amber));
    box-shadow: 0 0 12px rgba(46,230,255,.65); border-radius: 99px; }

  .count { margin-top: 12px; font-size: 13px; color: var(--dim); letter-spacing: .06em; }
  .count b { color: #fff; font-variant-numeric: tabular-nums; }

  .btn {
    display: inline-block; margin-top: 22px; padding: 14px 34px;
    font-weight: 700; font-size: 16px; letter-spacing: .05em; text-decoration: none;
    color: #03222b; background: linear-gradient(180deg, #6ff0ff, #17b6d8);
    border-radius: 12px; box-shadow: 0 0 26px rgba(46,230,255,.45), 0 8px 22px rgba(0,0,0,.4);
    transition: transform .15s ease, box-shadow .15s ease;
    animation: btnpulse 2.2s ease-in-out infinite;
  }
  .btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 40px rgba(46,230,255,.75), 0 12px 26px rgba(0,0,0,.45); }
  @keyframes btnpulse { 0%,100% { box-shadow: 0 0 18px rgba(46,230,255,.35), 0 8px 22px rgba(0,0,0,.4); } 50% { box-shadow: 0 0 34px rgba(46,230,255,.6), 0 8px 22px rgba(0,0,0,.4); } }

  footer { margin-top: 26px; font-size: 11px; letter-spacing: .26em; color: rgba(234,246,255,.35); text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) {
    .floor, .sweep, h1 .shine, .btn, .glow, .kicker .dot { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <canvas id="stars"></canvas>
  <div class="floor"></div>
  <div class="scan"></div>
  <div class="sweep"></div>

  <main class="card">
    <div class="kicker"><span class="dot"></span>System Notice // Relocation</div>
    <h1>DOX BOX<span class="shine" aria-hidden="true">DOX BOX</span></h1>
    <p class="moved">This startpage has moved to a <b>new home</b>.</p>

    <div class="term" id="term" aria-hidden="true"></div>

    <div class="bar"><i id="barFill"></i></div>
    <p class="count">Redirecting in <b id="count">5</b>s — or skip the wait:</p>

    <a class="btn" href="https://start.dox.box">ENTER THE NEW DOX BOX&nbsp;&nbsp;→</a>

    <footer>DanversKara</footer>
  </main>

  <!-- Honeypot: invisible to people, candy for crawlers — leads to the tarpit. -->
  <a href="https://bots.dox.box/maze" rel="nofollow" tabindex="-1" aria-hidden="true" style="display:none">archive</a>

<script>
  // ── countdown + redirect ─────────────────────────────────────────────
  var DEST = "https://start.dox.box", TOTAL = 5, left = TOTAL;
  var countEl = document.getElementById("count"), barEl = document.getElementById("barFill");
  var started = Date.now();
  var timer = setInterval(function () {
    var elapsed = (Date.now() - started) / 1000;
    left = Math.max(0, TOTAL - elapsed);
    countEl.textContent = Math.ceil(left);
    barEl.style.width = Math.min(100, (elapsed / TOTAL) * 100) + "%";
    if (left <= 0) { clearInterval(timer); location.replace(DEST); }
  }, 100);

  // ── terminal type-out ────────────────────────────────────────────────
  var lines = [
    '<span class="p">&gt;</span> legacy startpage .......... <span class="ok">RETIRED</span>',
    '<span class="p">&gt;</span> new coordinates ........... <span class="amber">start.dox.box</span>',
    '<span class="p">&gt;</span> status .................... <span class="ok">ONLINE</span>',
    '<span class="p">&gt;</span> rerouting all pilots ...... <span class="ok">NOW</span>'
  ];
  var term = document.getElementById("term"), li = 0;
  function typeLine() {
    if (li >= lines.length) { term.lastChild && term.lastChild.classList.add("caret"); return; }
    var d = document.createElement("div");
    d.className = "line"; d.innerHTML = lines[li];
    term.appendChild(d); li++;
    setTimeout(typeLine, 620);
  }
  setTimeout(typeLine, 350);

  // ── particle field ───────────────────────────────────────────────────
  var cv = document.getElementById("stars"), ctx = cv.getContext("2d"), W, H, ps = [];
  function size() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    ps = [];
    var n = Math.min(110, Math.floor(W * H / 16000));
    for (var i = 0; i < n; i++) ps.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.6 + .3, s: Math.random() * .35 + .06,
      hue: Math.random() < .82 ? "46,230,255" : "255,179,71",
      tw: Math.random() * Math.PI * 2
    });
  }
  size(); addEventListener("resize", size);
  (function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      p.y -= p.s; if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
      var a = .25 + .55 * Math.abs(Math.sin(t / 1400 + p.tw));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fillStyle = "rgba(" + p.hue + "," + a.toFixed(3) + ")"; ctx.fill();
    }
    requestAnimationFrame(draw);
  })(0);
</script>
</body>
</html>
