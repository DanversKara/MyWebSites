<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DOX BOX ⬡</title>
<script>
  try {
    const s = localStorage.getItem('theme');
    document.documentElement.dataset.theme =
      s || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
</script>
<style>
  :root{
    --bg:#0a0c11;
    --glow1:rgba(88,120,255,.18);
    --glow2:rgba(255,90,180,.12);
    --card:rgba(255,255,255,.045);
    --card-hi:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.08);
    --border-hi:rgba(255,255,255,.2);
    --text:#e9ecf3;
    --muted:#858da3;
  }
  html[data-theme="light"]{
    --bg:#f4f5f8;
    --glow1:rgba(120,150,255,.28);
    --glow2:rgba(255,140,200,.22);
    --card:rgba(255,255,255,.72);
    --card-hi:#ffffff;
    --border:rgba(10,15,40,.08);
    --border-hi:rgba(10,15,40,.18);
    --text:#151a24;
    --muted:#6b7385;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    color:var(--text);
    background:var(--bg);
    background-image:
      radial-gradient(60rem 40rem at 15% -10%, var(--glow1), transparent 60%),
      radial-gradient(50rem 35rem at 90% 0%, var(--glow2), transparent 55%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:44px 20px 64px}

  /* header */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:30px}
  #time{font-size:2.4rem;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
  #date{color:var(--muted);font-size:13.5px;margin-top:2px}
  #themeBtn{
    width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;
    border-radius:11px;border:1px solid var(--border);background:var(--card);
    color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  }
  #themeBtn:hover{background:var(--card-hi);color:var(--text);border-color:var(--border-hi)}
  #themeBtn svg{width:17px;height:17px;display:block}

  /* search */
  .search{margin-bottom:30px}
  .search input{
    width:100%;padding:14px 16px;font-size:16px;font-family:inherit;
    border-radius:14px;border:1px solid var(--border);background:var(--card);
    color:var(--text);outline:none;
    transition:border-color .15s,background .15s;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--border-hi);background:var(--card-hi)}
  #hint{height:18px;margin:7px 2px 0;font-size:12.5px;color:var(--muted)}

  /* groups */
  .group{margin-bottom:26px}
  .group[hidden]{display:none}
  .group h2{
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;
    color:var(--muted);margin:0 0 10px 2px;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}

  .tile{
    display:flex;align-items:center;gap:11px;min-width:0;
    padding:10px 13px;border-radius:12px;
    background:var(--card);border:1px solid var(--border);
    color:inherit;text-decoration:none;
    transition:transform .12s ease,background .12s,border-color .12s;
  }
  .tile[hidden]{display:none}
  .tile:hover,.tile:focus-visible{
    background:var(--card-hi);border-color:var(--border-hi);
    transform:translateY(-2px);outline:none;
  }
  .tile:active{transform:translateY(0)}
  .icon{
    width:26px;height:26px;flex:0 0 26px;border-radius:7px;
    display:grid;place-items:center;overflow:hidden;
    font-size:12px;font-weight:700;color:#fff;
  }
  .icon img{width:100%;height:100%;object-fit:contain;display:block}

  /* name + description column */
  .tile .text{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
  .tile .label{
    font-size:14px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tile .desc{
    font-size:11.5px;line-height:1.35;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  footer{margin-top:38px;color:var(--muted);font-size:12.5px;text-align:center}
  kbd{
    font:inherit;font-size:11.5px;padding:1px 5px;border-radius:5px;
    border:1px solid var(--border);background:var(--card);
  }
  @media (max-width:520px){
    .wrap{padding-top:30px}
    #time{font-size:1.9rem}
    .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>
    <button id="themeBtn" aria-label="Toggle theme"></button>
  </header>

  <div class="search">
    <input id="q" type="text" placeholder="Filter links, or press Enter to search…"
           autocomplete="off" autocapitalize="off" spellcheck="false" />
    <div id="hint"></div>
  </div>

  <main id="groups"></main>

  <footer>
    <kbd>/</kbd> to search &nbsp;·&nbsp; <kbd>Esc</kbd> to clear &nbsp;·&nbsp; <kbd>Enter</kbd> opens top match
  </footer>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   EDIT THIS BLOCK — that's the whole config.
   desc: "…"    → small grey line under the name (optional)
   icon: false  → skip favicon lookup (use for LAN IPs / localhost)
   icon: "url"  → use a custom image
   ───────────────────────────────────────────────────────────── */
const CONFIG = {
  search: "https://duckduckgo.com/?q=",
  groups: [
    {
      title: "Infrastructure",
      links: [
        { name: "Proxmox",             desc: "Hypervisor · VMs & containers", url: "https://192.168.8.196:8006/#v1:0:18:4:::::::", icon: false },
        { name: "YunoHost",            desc: "Self-hosted app server",        url: "https://192.168.8.197/yunohost/admin/#/update", icon: false },
        { name: "Docker",              desc: "Container management",          url: "http://192.168.8.100:9000/#!/3/docker/containers", icon: false },
        { name: "Nginx Proxy Manager", desc: "Reverse proxy & SSL certs",     url: "http://192.168.8.147:81", icon: false },
        { name: "Cloudflare",          desc: "DNS, domains & tunnels",        url: "https://dash.cloudflare.com/" },
      ]
    },
    {
      title: "Services",
      links: [
        { name: "Home Assistant",  desc: "Smart home control",        url: "https://192.168.8.162:8123/dashboard-test/0", icon: false },
        { name: "IncrediblePBX",   desc: "VoIP phone system",         url: "http://192.168.8.220", icon: false },
        { name: "Drive Storage",   desc: "Files, sync & sharing",     url: "https://drive.dox.box/apps/files/files" },
        { name: "Bearer Mail",     desc: "Email hosting",             url: "https://bearermail.com" },
        { name: "Downloader",      desc: "Downloads & media grabber", url: "http://192.168.8.184:8081", icon: false },
        { name: "CCTV",            desc: "Camera feeds & recordings", url: "http://192.168.8.212:8765/", icon: false },
      ]
    },
    {
      title: "Web & Support",
      links: [
        { name: "MyRef.info",      desc: "Reference notes & docs",    url: "https://myref.info/" },
        { name: "MyLinks",         desc: "Personal link page",        url: "https://karas.page" },
        { name: "Support the Lab", desc: "Donate / tip jar",          url: "https://pay.dox.box" },
        { name: "Short URLs",      desc: "Link shortener",            url: "https://links.dox.box" },
      ]
    },
  ]
};
/* ───────────────────────── end config ───────────────────────── */

const root    = document.documentElement;
const q       = document.getElementById('q');
const hintEl  = document.getElementById('hint');
const groupsEl= document.getElementById('groups');
const timeEl  = document.getElementById('time');
const dateEl  = document.getElementById('date');
const themeBtn= document.getElementById('themeBtn');

/* ---------- icons ---------- */
function hashHue(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}
function faviconFor(url){
  try {
    const h = new URL(url).hostname;
    if (/^(\d{1,3}\.){3}\d{1,3}$/.test(h) || h === 'localhost' || !h.includes('.')) return null;
    return `https://www.google.com/s2/favicons?domain=${h}&sz=64`;
  } catch (e) { return null; }
}
function makeIcon(link){
  const box = document.createElement('span');
  box.className = 'icon';
  box.style.background = `hsl(${hashHue(link.url)} 52% 42%)`;
  box.textContent = (link.name.trim()[0] || '?').toUpperCase();

  if (link.icon !== false) {
    const src = typeof link.icon === 'string' ? link.icon : faviconFor(link.url);
    if (src) {
      const img = new Image();
      img.alt = '';
      img.decoding = 'async';
      img.onload = () => { box.textContent = ''; box.style.background = 'transparent'; box.appendChild(img); };
      img.src = src;
    }
  }
  return box;
}

/* ---------- render ---------- */
for (const group of CONFIG.groups) {
  const g = document.createElement('section');
  g.className = 'group';

  const h = document.createElement('h2');
  h.textContent = group.title;
  g.appendChild(h);

  const grid = document.createElement('div');
  grid.className = 'grid';

  for (const link of group.links) {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = link.url;
    a.title = link.desc ? link.url + '\n' + link.desc : link.url;
    a.dataset.name = link.name;
    a.dataset.search = (link.name + ' ' + (link.desc || '') + ' ' + link.url).toLowerCase();

    const text = document.createElement('span');
    text.className = 'text';

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = link.name;
    text.appendChild(label);

    if (link.desc) {
      const desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = link.desc;
      text.appendChild(desc);
    }

    a.append(makeIcon(link), text);
    grid.appendChild(a);
  }

  g.appendChild(grid);
  groupsEl.appendChild(g);
}

/* ---------- filter / search ---------- */
function applyFilter(){
  const val = q.value.trim().toLowerCase();
  let first = null;

  document.querySelectorAll('.group').forEach(g => {
    let any = false;
    g.querySelectorAll('.tile').forEach(t => {
      const hit = !val || t.dataset.search.includes(val);
      t.hidden = !hit;
      if (hit) { any = true; if (!first) first = t; }
    });
    g.hidden = !any;
  });

  hintEl.textContent = val
    ? (first ? '↵  ' + first.dataset.name : '↵  Search the web for “' + q.value.trim() + '”')
    : '';
}

q.addEventListener('input', applyFilter);

q.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = [...document.querySelectorAll('.tile')].find(t => !t.hidden);
    const val = q.value.trim();
    if (first) location.href = first.href;
    else if (val) location.href = CONFIG.search + encodeURIComponent(val);
  }
  if (e.key === 'Escape') { q.value = ''; applyFilter(); q.blur(); }
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) {
    e.preventDefault();
    q.focus();
    q.select();
  }
});

/* ---------- clock ---------- */
function tick(){
  const d = new Date();
  timeEl.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  dateEl.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
tick();
setInterval(tick, 10000);

/* ---------- theme ---------- */
const SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

function paintThemeBtn(){
  const dark = root.dataset.theme === 'dark';
  themeBtn.innerHTML = dark ? SUN : MOON;
  themeBtn.title = dark ? 'Switch to light' : 'Switch to dark';
}
themeBtn.addEventListener('click', () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  paintThemeBtn();
});
paintThemeBtn();
</script>
</body>
</html>
