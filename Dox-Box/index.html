<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DOX BOX ⬡ — Blades</title>
<meta name="description" content="DOX BOX startpage in the style of the Xbox 360 Blades dashboard." />
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }
  catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<style>
  /* ═══════════════ XBOX 360 BLADES — DOX BOX EDITION ═══════════════
     The 2005 dashboard: silver-grey stage, coloured blade spines down
     the left, one blade open at a time, menu items that pop toward you
     when selected, and the green Guide glow over everything. */
  :root{
    --green:#76bc21; --green-hi:#9ee04a; --green-deep:#4c8c0f;
    --ink:#23272b; --muted:#6d747c;
    --panel:#eef0f2; --panel-edge:#c9ced4;
    --tile:#ffffff; --tile-edge:#d4d8dd;
    --stage1:#d7dade; --stage2:#aeb4ba; --stage3:#878e96;
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden;
    font:15px/1.45 "Segoe UI",ui-sans-serif,system-ui,-apple-system,Inter,Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(70rem 34rem at 78% -12%, rgba(158,224,74,.28), transparent 55%),
      radial-gradient(46rem 30rem at -10% 110%, rgba(255,255,255,.35), transparent 60%),
      linear-gradient(180deg, var(--stage1) 0%, var(--stage2) 58%, var(--stage3) 100%);
    -webkit-font-smoothing:antialiased;
  }
  /* faint 360 "rings" watermark, bottom-right */
  body::after{
    content:''; position:fixed; right:-190px; bottom:-230px; width:560px; height:560px;
    border-radius:50%; pointer-events:none; opacity:.16;
    background:
      radial-gradient(circle, transparent 118px, #fff 119px, #fff 128px, transparent 129px),
      radial-gradient(circle, transparent 178px, #fff 179px, #fff 188px, transparent 189px),
      radial-gradient(circle, transparent 238px, var(--green) 239px, var(--green) 250px, transparent 251px);
  }
  .stage{height:100dvh; display:flex; flex-direction:column; max-width:1460px; margin:0 auto; padding:18px 20px 12px;}

  /* ── top bar: gamercard + search ─────────────────────────────── */
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex:0 0 auto; min-width:0;}
  .gamercard{
    display:flex; align-items:center; gap:12px; min-width:0;
    background:linear-gradient(180deg,#fdfdfd,#e3e6e9);
    border:1px solid rgba(255,255,255,.75); border-bottom-color:#b9bfc6;
    border-radius:14px; padding:8px 16px 8px 9px;
    box-shadow:0 3px 10px rgba(30,40,20,.18), inset 0 1px 0 #fff;
  }
  .gamercard .sphere{width:42px;height:42px;flex:0 0 42px;filter:drop-shadow(0 2px 3px rgba(60,120,10,.4))}
  .gamercard .who{min-width:0}
  .gamercard .gt{font-size:19px;font-weight:700;letter-spacing:.01em;line-height:1.1;white-space:nowrap}
  .gamercard .gt .box360{color:var(--green-deep)}
  .gamercard .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gamercard .clock{
    margin-left:10px; padding-left:14px; border-left:1px solid #cfd4da; text-align:right;
  }
  #time{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
  #date{font-size:11.5px;color:var(--muted)}
  .search{flex:1 1 250px; max-width:400px; min-width:150px; margin-left:auto; position:relative}
  .search input{
    width:100%; padding:12px 16px 12px 40px; font:inherit; font-size:15px;
    border-radius:999px; border:1px solid #b7bdc4; color:var(--ink);
    background:linear-gradient(180deg,#ffffff,#eef0f2);
    box-shadow:inset 0 2px 5px rgba(20,30,10,.10), 0 2px 6px rgba(30,40,20,.10); outline:none;
  }
  .search input:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(118,188,33,.35), inset 0 2px 5px rgba(20,30,10,.08)}
  .search .mag{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#8a929b; pointer-events:none}
  #hint{position:absolute; left:16px; top:calc(100% + 5px); font-size:12px; color:#4a5158; text-shadow:0 1px 0 rgba(255,255,255,.5); height:15px; white-space:nowrap}
  .iconbtn{
    width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:50%;
    border:1px solid #b7bdc4; background:linear-gradient(180deg,#ffffff,#e6e9ec); color:#5a626b;
    cursor:pointer; box-shadow:0 2px 6px rgba(30,40,20,.12); font-size:17px;
  }
  .iconbtn:hover{color:var(--ink); border-color:var(--green)}
  .iconbtn[aria-pressed="true"]{color:var(--green-deep); border-color:var(--green); background:linear-gradient(180deg,#f4fbec,#e2f2cb)}

  /* ── blades ──────────────────────────────────────────────────── */
  .blades{flex:1 1 auto; display:flex; gap:0; min-height:0; filter:drop-shadow(0 14px 28px rgba(25,35,15,.28));}
  .blade{display:flex; min-width:0; flex:0 0 auto; transition:flex .5s cubic-bezier(.7,0,.2,1);}
  .blade.active{flex:1 1 auto;}
  .blade-tab{
    writing-mode:vertical-rl; transform:rotate(180deg);
    flex:0 0 52px; display:flex; align-items:center; justify-content:flex-end; gap:12px;
    padding:20px 0 22px; border:0; cursor:pointer; font:inherit;
    border-radius:16px 0 0 16px; margin-right:-6px; position:relative; z-index:1;
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35);
    box-shadow:inset -6px 0 10px rgba(0,0,0,.18), inset 1px 0 0 rgba(255,255,255,.35);
    transition:filter .15s;
  }
  .blade-tab:hover{filter:brightness(1.1)}
  .blade-tab .tab-name{font-size:15.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap}
  .blade-tab .tab-count{font-size:11px; font-weight:600; opacity:.85; letter-spacing:.06em}
  .blade-tab .tab-count.zero{opacity:.45}
  .blade[data-color="system"]    .blade-tab{background:linear-gradient(90deg,#546e7e,#7d99a9)}
  .blade[data-color="live"]      .blade-tab{background:linear-gradient(90deg,#c85f10,#ef8c2d)}
  .blade[data-color="media"]     .blade-tab{background:linear-gradient(90deg,#44539f,#6d7fd6)}
  .blade[data-color="market"]    .blade-tab{background:linear-gradient(90deg,#70378d,#9d5bbd)}
  .blade[data-color="community"] .blade-tab{background:linear-gradient(90deg,#568c14,#7fb52e)}
  .blade-panel{
    flex:1 1 auto; min-width:0; width:0; overflow:hidden; opacity:0; visibility:hidden;
    background:linear-gradient(180deg,#fbfcfc 0%, var(--panel) 120px, #e2e5e8 100%);
    border:1px solid var(--panel-edge); border-left:0;
    border-radius:0 var(--radius) var(--radius) 0;
    transition:opacity .3s ease .12s, visibility 0s;
    display:flex; flex-direction:column;
  }
  .blade.active .blade-panel{width:auto; opacity:1; visibility:visible;}
  .blade-head{
    padding:24px 30px 6px; flex:0 0 auto;
    background:
      radial-gradient(34rem 9rem at 12% -30%, color-mix(in srgb, var(--blade-accent) 20%, transparent), transparent 70%);
  }
  .blade-head h1{margin:0; font-size:30px; font-weight:300; letter-spacing:.01em; color:#2b3036}
  .blade-head h1 b{font-weight:700}
  .blade-head .blade-sub{margin:3px 0 0; color:var(--muted); font-size:13.5px}
  .blade-head .rule{height:3px; margin-top:14px; border-radius:2px;
    background:linear-gradient(90deg, var(--blade-accent), transparent 75%);}
  .blade[data-color="system"]    {--blade-accent:#6d8a9c}
  .blade[data-color="live"]      {--blade-accent:#e67e22}
  .blade[data-color="media"]     {--blade-accent:#5a6ac9}
  .blade[data-color="market"]    {--blade-accent:#8a4fa3}
  .blade[data-color="community"] {--blade-accent:#76bc21}
  .blade-body{flex:1 1 auto; overflow-y:auto; padding:16px 30px 26px; scrollbar-width:thin; scrollbar-color:#b6bcc3 transparent}
  .blade-body::-webkit-scrollbar{width:9px}
  .blade-body::-webkit-scrollbar-thumb{background:#b6bcc3; border-radius:5px}

  /* menu tiles — 360 dashboard list items */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:9px}
  .tile{
    display:flex; align-items:center; gap:12px; min-width:0; position:relative;
    padding:11px 14px 11px 12px; border-radius:10px; text-decoration:none; color:inherit;
    background:linear-gradient(180deg,#ffffff,#f1f3f4); border:1px solid var(--tile-edge);
    box-shadow:0 1px 3px rgba(30,40,20,.07);
    transition:transform .13s ease, box-shadow .13s, background .13s, border-color .13s;
  }
  .tile[hidden]{display:none}
  .tile::before{content:''; position:absolute; left:0; top:8px; bottom:8px; width:4px; border-radius:3px;
    background:var(--green); opacity:0; transition:opacity .13s}
  .tile:hover, .tile:focus-visible, .tile.selected{
    background:linear-gradient(180deg,#ffffff,#eef6df); border-color:#a9cf7d;
    transform:translateX(5px) scale(1.015); outline:none;
    box-shadow:0 6px 16px rgba(90,140,20,.20), 0 0 0 1px rgba(118,188,33,.35);
  }
  .tile:hover::before, .tile:focus-visible::before, .tile.selected::before{opacity:1}
  .tile:active{transform:translateX(5px) scale(.99)}
  .tile .chev{margin-left:auto; color:#a7aeb6; font-size:18px; flex:0 0 auto; transition:color .13s, transform .13s}
  .tile:hover .chev, .tile.selected .chev{color:var(--green-deep); transform:translateX(2px)}
  .icon{width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:grid;place-items:center;
    overflow:hidden;font-size:14px;font-weight:700;color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 3px rgba(0,0,0,.18)}
  .icon img{width:100%;height:100%;object-fit:contain;display:block}
  .tile .text{display:flex;flex-direction:column;min-width:0}
  .tile .label{font-size:14.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .desc{font-size:12px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile.has-choices::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);opacity:.65;flex:0 0 6px;position:absolute;top:9px;right:10px}
  .empty-note{display:none; color:var(--muted); font-size:14px; padding:12px 2px}
  .blade-body.no-matches .empty-note{display:block}
  .blade-foot{flex:0 0 auto; padding:0 30px 16px; color:var(--muted); font-size:12.5px}
  .blade-foot .quote{font-style:italic; max-width:64ch}
  .blade-foot .quote span{display:block; font-style:normal; font-size:11px; opacity:.8; margin-top:2px}

  /* ── bottom hint bar ─────────────────────────────────────────── */
  .hintbar{
    flex:0 0 auto; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:10px 4px 2px; color:#3c434a; font-size:12.5px; text-shadow:0 1px 0 rgba(255,255,255,.45);
  }
  .hintbar .spacer{flex:1}
  .hintbar a{color:#3c434a; text-decoration:none}
  .hintbar a:hover{color:var(--green-deep); text-decoration:underline; text-underline-offset:3px}
  .pad{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
  .pbtn{display:inline-grid; place-items:center; width:19px; height:19px; border-radius:50%;
    font-size:10.5px; font-weight:800; color:#fff; box-shadow:inset 0 -2px 3px rgba(0,0,0,.28), 0 1px 2px rgba(0,0,0,.25)}
  .pbtn.a{background:#5da41f}.pbtn.b{background:#d43a2f}.pbtn.x{background:#2f6fd0}.pbtn.y{background:#e3a812;color:#3a2c00}
  .bumper{display:inline-grid; place-items:center; padding:1px 7px; border-radius:7px 7px 3px 3px;
    background:linear-gradient(180deg,#f4f5f6,#c9ced3); border:1px solid #a9afb6; font-size:10px; font-weight:800; color:#3c434a}
  kbd{font:inherit;font-size:11px;padding:1px 5px;border-radius:5px;border:1px solid #a9afb6;background:rgba(255,255,255,.6)}

  /* ── chooser = Xbox Guide overlay ────────────────────────────── */
  .chooser{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;
    background:rgba(24,28,22,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    animation:fadeIn .14s ease;}
  .chooser[hidden]{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes guideIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .chooser-card{
    width:100%; max-width:380px; border-radius:18px; overflow:hidden;
    background:linear-gradient(180deg,#fbfcfc,#e8ebed); border:1px solid #c3c9cf;
    box-shadow:0 30px 70px rgba(10,20,0,.5), 0 0 0 4px rgba(118,188,33,.25);
    animation:guideIn .2s cubic-bezier(.2,.9,.3,1.08);
  }
  .chooser-head{background:linear-gradient(90deg,var(--green-deep),var(--green) 70%,var(--green-hi));
    color:#fff; padding:15px 20px 13px; text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .chooser-title{font-size:17px;font-weight:700;margin:0}
  .chooser-sub{font-size:12.5px;margin:2px 0 0;opacity:.92}
  .chooser-options{display:grid;gap:8px;padding:16px 16px 6px}
  .chooser-option{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:11px;width:100%;
    border:1px solid var(--tile-edge);background:linear-gradient(180deg,#fff,#f1f3f4);color:inherit;font:inherit;
    text-align:left;cursor:pointer;transition:background .13s,border-color .13s,transform .1s;}
  .chooser-option:hover{background:linear-gradient(180deg,#fff,#eef6df);border-color:#a9cf7d}
  .chooser-option:active{transform:scale(.985)}
  .chooser-option .opt-label{font-size:14px;font-weight:600;line-height:1.3}
  .chooser-option .opt-hint{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3}
  .chooser-option .opt-emoji{flex:0 0 32px;width:32px;height:32px;border-radius:9px;
    display:grid;place-items:center;background:#eef1f3;font-size:16px}
  .chooser-cancel{margin:10px 16px 16px;width:calc(100% - 32px);padding:11px;border-radius:11px;
    border:1px solid var(--tile-edge);background:transparent;color:var(--muted);
    font:inherit;font-size:13.5px;cursor:pointer}
  .chooser-cancel:hover{background:#fff;color:var(--ink)}


  /* ── boot intro (homage, original artwork — see README) ──────── */
  #boot{position:fixed; inset:0; z-index:300; display:grid; place-items:center;
    background:
      radial-gradient(70rem 34rem at 78% -12%, rgba(158,224,74,.28), transparent 55%),
      linear-gradient(180deg, #d7dade 0%, #aeb4ba 58%, #878e96 100%);
    transition:opacity .5s ease, visibility .5s; cursor:pointer;}
  #boot.done{opacity:0; visibility:hidden; pointer-events:none}
  .boot-inner{text-align:center; position:relative; padding:20px}
  .boot-stage{position:relative; width:170px; height:170px; margin:0 auto 10px; display:grid; place-items:center}
  .boot-sphere{width:112px; height:112px; filter:drop-shadow(0 10px 22px rgba(60,120,10,.45));
    animation:bootDrop .9s cubic-bezier(.2,.9,.3,1.15) both}
  @keyframes bootDrop{from{opacity:0; transform:translateY(-26px) scale(.72)} to{opacity:1; transform:none}}
  .boot-orbit{position:absolute; inset:6px; border-radius:50%;
    border:3px solid transparent; border-top-color:var(--green); border-right-color:rgba(118,188,33,.45);
    animation:bootOrbit 1.15s cubic-bezier(.3,.7,.3,1) both}
  @keyframes bootOrbit{from{opacity:0; transform:rotate(-140deg) scale(.82)} 60%{opacity:1} to{opacity:0; transform:rotate(160deg) scale(1.04)}}
  .boot-ring{position:absolute; inset:26px; border-radius:50%; border:2px solid rgba(118,188,33,.5);
    animation:bootRing 1.5s ease-out .25s both}
  .boot-ring.r2{animation-delay:.5s}
  @keyframes bootRing{from{opacity:.9; transform:scale(.55)} to{opacity:0; transform:scale(1.45)}}
  .boot-name{font-size:46px; font-weight:300; letter-spacing:.02em; color:#23272b; line-height:1.05;
    animation:bootUp .6s ease .6s both}
  .boot-name b{font-weight:700; color:var(--green-deep)}
  @keyframes bootUp{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  .boot-tag{margin-top:7px; font-size:14px; color:#5f6871; letter-spacing:.04em; animation:bootUp .6s ease .85s both}
  .boot-bar{width:0; height:3px; margin:22px auto 0; border-radius:2px;
    background:linear-gradient(90deg, var(--green-deep), var(--green-hi));
    animation:bootBar 1.55s cubic-bezier(.4,0,.2,1) .3s both}
  @keyframes bootBar{from{width:0} to{width:190px}}
  .boot-skip{position:absolute; left:0; right:0; bottom:-64px; font-size:11.5px; color:#7a828b;
    letter-spacing:.08em; text-transform:uppercase; animation:bootUp .5s ease 1.2s both}
  .stage.enter{animation:stageIn .55s ease both}
  @keyframes stageIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ #boot{display:none} }


  /* ── dark theme (default) ────────────────────────────────────── */
  html[data-theme="dark"]{
    --stage1:#34383d; --stage2:#22252a; --stage3:#101215;
    --ink:#e9edf2; --muted:#9aa4ad; --panel:#23262b;
  }
  html[data-theme="dark"] body{
    background:
      radial-gradient(70rem 34rem at 78% -12%, rgba(118,188,33,.20), transparent 55%),
      radial-gradient(46rem 30rem at -10% 110%, rgba(255,255,255,.05), transparent 60%),
      linear-gradient(180deg, var(--stage1) 0%, var(--stage2) 58%, var(--stage3) 100%);
  }
  html[data-theme="dark"] .gamercard{
    background:linear-gradient(180deg,#2e3237,#22252a);
    border-color:#454b52; border-bottom-color:#17191c;
    box-shadow:0 3px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
  }
  html[data-theme="dark"] .gamercard .gt .box360{color:var(--green-hi)}
  html[data-theme="dark"] .gamercard .clock{border-left-color:#3c4249}
  html[data-theme="dark"] .search input{
    background:linear-gradient(180deg,#2a2e33,#22252a); border-color:#454b52; color:var(--ink);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.3);
  }
  html[data-theme="dark"] .search input::placeholder{color:#79828c}
  html[data-theme="dark"] .search .mag{color:#7d868f}
  html[data-theme="dark"] #hint{color:#aeb6bf; text-shadow:none}
  html[data-theme="dark"] .iconbtn{
    background:linear-gradient(180deg,#2e3237,#22252a); border-color:#454b52; color:#aeb6bf;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  html[data-theme="dark"] .iconbtn:hover{color:#fff}
  html[data-theme="dark"] .iconbtn[aria-pressed="true"]{
    color:var(--green-hi); border-color:var(--green);
    background:linear-gradient(180deg,#2c3a1c,#222d13);
  }
  html[data-theme="dark"] .blade-panel{
    background:linear-gradient(180deg,#2b2f34 0%, var(--panel) 120px, #1b1e22 100%);
    border-color:#3c4249;
  }
  html[data-theme="dark"] .blade-head h1{color:#eef1f4}
  html[data-theme="dark"] .blade-body{scrollbar-color:#454b52 transparent}
  html[data-theme="dark"] .blade-body::-webkit-scrollbar-thumb{background:#454b52}
  html[data-theme="dark"] .tile{
    background:linear-gradient(180deg,#2e3237,#26292e); border-color:#3f454d;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  html[data-theme="dark"] .tile:hover, html[data-theme="dark"] .tile:focus-visible, html[data-theme="dark"] .tile.selected{
    background:linear-gradient(180deg,#353d2b,#28331e); border-color:#6f9c3e;
    box-shadow:0 6px 16px rgba(0,0,0,.45), 0 0 0 1px rgba(118,188,33,.4);
  }
  html[data-theme="dark"] .tile .chev{color:#6a737e}
  html[data-theme="dark"] .hintbar{color:#c3cad1; text-shadow:0 1px 0 rgba(0,0,0,.4)}
  html[data-theme="dark"] .hintbar a{color:#c3cad1}
  html[data-theme="dark"] .hintbar a:hover{color:var(--green-hi)}
  html[data-theme="dark"] .bumper{
    background:linear-gradient(180deg,#3a3f45,#26292e); border-color:#4a5058; color:#d5dae0;
  }
  html[data-theme="dark"] kbd{border-color:#4a5058; background:rgba(255,255,255,.08)}
  html[data-theme="dark"] .chooser-card{
    background:linear-gradient(180deg,#2b2f34,#22252a); border-color:#454b52;
    box-shadow:0 30px 70px rgba(0,0,0,.65), 0 0 0 4px rgba(118,188,33,.25);
  }
  html[data-theme="dark"] .chooser-option{
    background:linear-gradient(180deg,#2e3237,#26292e); border-color:#3f454d;
  }
  html[data-theme="dark"] .chooser-option:hover{background:linear-gradient(180deg,#353d2b,#28331e); border-color:#6f9c3e}
  html[data-theme="dark"] .chooser-option .opt-emoji{background:#1d2023}
  html[data-theme="dark"] .chooser-cancel{border-color:#3f454d}
  html[data-theme="dark"] .chooser-cancel:hover{background:#2e3237; color:#fff}
  html[data-theme="dark"] #boot{
    background:
      radial-gradient(70rem 34rem at 78% -12%, rgba(118,188,33,.20), transparent 55%),
      linear-gradient(180deg, #34383d 0%, #22252a 58%, #101215 100%);
  }
  html[data-theme="dark"] .boot-name{color:#eef1f4}
  html[data-theme="dark"] .boot-tag{color:#9aa4ad}

/* ---------- platform detection ---------- */
const isAndroid = /android/i.test(navigator.userAgent);
const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function pickPlatformUrl(choice) {
  if (isAndroid && choice.android) return choice.android;
  if (isIOS && choice.ios)         return choice.ios;
  return choice.url;
}

/* ---------- force-browser (defeat App Links hijack) ---------- */
let _browserPkg = null;
(function initBrowserDetect() {
  const ua = navigator.userAgent || "";
  if (/SamsungBrowser/i.test(ua))      { _browserPkg = "com.sec.android.app.sbrowser"; return; }
  if (/EdgA/i.test(ua))                { _browserPkg = "com.microsoft.emmx"; return; }
  if (/Firefox/i.test(ua))            { _browserPkg = "org.mozilla.firefox"; return; }
  if (/Opera Mini|Opera Mobi|OPR\//i.test(ua)) { _browserPkg = "com.opera.browser"; return; }
  if (navigator.brave && navigator.brave.isBrave) {
    navigator.brave.isBrave().then(b => { _browserPkg = b ? "com.brave.browser" : "com.android.chrome"; })
      .catch(() => { _browserPkg = "com.android.chrome"; });
  } else {
    _browserPkg = "com.android.chrome";
  }
})();
function forceBrowserIntent(httpsUrl) {
  const u = new URL(httpsUrl);
  const pkg = _browserPkg || "com.android.chrome";
  const fallback = encodeURIComponent(httpsUrl);
  return `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=${u.protocol.replace(":", "")};package=${pkg};S.browser_fallback_url=${fallback};end`;
}

function hashHue(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return h;
}
function faviconFor(url){
  try {
    let targetUrl = url;
    if (url.startsWith('ext+container://')) {
        const m = url.match(/ext\+container:\/\/[^\/]+\/(.*)/);
        if (m && m[1]) targetUrl = m[1];
    }
    const h = new URL(targetUrl).hostname;
    if (/^(\d{1,3}\.){3}\d{1,3}$/.test(h) || h === 'localhost' || !h.includes('.') || /\.box$/.test(h)) return null;
    return `https://www.google.com/s2/favicons?domain=${h}&sz=64`;
  } catch (e) { return null; }
}
function makeIcon(link){
  const box = document.createElement('span');
  box.className = 'icon';
  const g = GLYPHS[link.glyph || GLYPH_FOR[link.name]];
  if (g) {
    box.style.background = `linear-gradient(135deg, hsl(${g.h} 62% 55%), hsl(${g.h} 62% 38%))`;
    box.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + g.p + '</svg>';
  } else {
    box.style.background = `hsl(${hashHue(link.url)} 52% 42%)`;
    box.textContent = (link.name.trim()[0] || '?').toUpperCase();
  }
  if (link.icon !== false) {
    const src = typeof link.icon === 'string' ? link.icon : faviconFor(link.url);
    if (src) {
      const img = new Image();
      img.alt = ''; img.decoding = 'async';
      img.onload = () => { box.textContent = ''; box.style.background = 'transparent'; box.appendChild(img); };
      img.src = src;
    }
  }
  return box;
}


/* ---------- Android app launching ---------- */
/* ONE intent per tap. Chrome/Firefox follow S.browser_fallback_url the
   moment the intent can't be handled, so chaining several intents
   (old behaviour) always ended on the web page after the first miss.

   The app must expose a BROWSABLE intent filter for this to work:
     - androidScheme { scheme, path }  -> app's own custom scheme (best for LAN/IP apps)
     - otherwise the https URL, which needs a verified App Link
   If the app can't take it, the browser opens webUrl (no Play Store). */
function launchAndroid(pkgs, webUrl, schemeHint, freshStart) {
  const pkg = Array.isArray(pkgs) ? pkgs[0] : pkgs;
  // freshStart: ask Android to restart the app's task instead of handing a new
  // link to a running copy (NEW_TASK | CLEAR_TASK = 0x10008000). For apps that
  // crash when a link arrives while they are already open (Home Assistant).
  const fb  = (freshStart ? 'launchFlags=0x10008000;' : '') +
              'S.browser_fallback_url=' + encodeURIComponent(webUrl);
  let target;
  if (schemeHint && schemeHint.scheme) {
    target = 'intent://' + (schemeHint.path || '') + '#Intent;scheme=' + schemeHint.scheme +
             ';package=' + pkg + ';' + fb + ';end';
  } else {
    let u; try { u = new URL(webUrl); } catch (e) { window.location.href = webUrl; return; }
    target = 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=' +
             u.protocol.replace(':', '') + ';package=' + pkg + ';' + fb + ';end';
  }
  window.location.href = target;
}

/* ---------- navigation ---------- */
function openUrl(url, fallback, forceBrowser) {
  if (forceBrowser && isAndroid && /^https?:/i.test(url)) {
    window.location.href = forceBrowserIntent(url);
    return;
  }
  if (url.startsWith('ext+container://')) {
    const m = url.match(/ext\+container:\/\/[^\/]+\/(.*)/);
    const realUrl = m ? m[1] : null;
    const isBrave = !!(navigator.brave && navigator.brave.isBrave);
    if (!isBrave) { window.location.href = realUrl || url; return; }
    tryCustom(url, realUrl);
    return;
  }
  if (!/^https?:/i.test(url)) {
    tryCustom(url, fallback || null);
    return;
  }
  window.location.href = url;
}

function tryCustom(schemeUrl, fallbackUrl) {
  let didLeave = false;
  const mark = () => { didLeave = true; };
  window.addEventListener('blur', mark, { once: true });
  const onVis = () => { if (document.hidden) mark(); };
  document.addEventListener('visibilitychange', onVis, { once: true });

  try { window.location.href = schemeUrl; } catch (e) {}

  setTimeout(() => {
    if (!didLeave && fallbackUrl) {
      window.removeEventListener('blur', mark);
      document.removeEventListener('visibilitychange', onVis);
      window.location.href = fallbackUrl;
    }
  }, 900);
}


const root    = document.documentElement;

/* ---------- chooser modal ---------- */
function openChooser(link) {
  chooserTitle.textContent = link.name;
  chooserOptions.innerHTML = '';

  link.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chooser-option';

    if (choice.emoji) {
      const em = document.createElement('span');
      em.className = 'opt-emoji';
      em.textContent = choice.emoji;
      btn.appendChild(em);
    }

    const textWrap = document.createElement('span');
    textWrap.style.display = 'flex';
    textWrap.style.flexDirection = 'column';
    textWrap.style.minWidth = '0';

    const lbl = document.createElement('span');
    lbl.className = 'opt-label';
    lbl.textContent = choice.label;
    textWrap.appendChild(lbl);

    if (choice.hint) {
      const hint = document.createElement('span');
      hint.className = 'opt-hint';
      hint.textContent = choice.hint;
      textWrap.appendChild(hint);
    }
    btn.appendChild(textWrap);

    btn.addEventListener('click', () => {
      closeChooser();
      if (isAndroid && choice.androidPkg) {
        setTimeout(() => launchAndroid(choice.androidPkg, choice.url, choice.androidScheme, choice.freshStart), 40);
        return;
      }
      const chosenUrl = pickPlatformUrl(choice);
      setTimeout(() => openUrl(chosenUrl, choice.fallback, choice.forceBrowser), 40);
    });

    chooserOptions.appendChild(btn);
  });

  chooserEl.hidden = false;
}

function closeChooser() { chooserEl.hidden = true; }

chooserCancel.addEventListener('click', closeChooser);
chooserEl.addEventListener('click', (e) => { if (e.target === chooserEl) closeChooser(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !chooserEl.hidden) { e.stopPropagation(); closeChooser(); }
});


/* ── blade definitions: your groups, dressed as 360 blades ── */
const BLADE_STYLE = [
  { color: 'system',    tab: 'System',      sub: 'Hypervisor, containers, proxy & tunnels — the machine room.' },
  { color: 'live',      tab: 'DOX BOX LIVE',   sub: 'Your connected services — mail, chat, phone & cameras.' },
  { color: 'media',     tab: 'Media',       sub: 'AI assistants, ready when you are.' },
  { color: 'market',    tab: 'Marketplace', sub: 'Shops & storefronts.' },
  { color: 'community', tab: 'Community',   sub: 'Your pages, your people, your lab.' },
];

/* ── tiny blade swoosh (WebAudio, off by default) ── */
let soundOn = false, audioCtx = null;
try { soundOn = localStorage.getItem('blades-sound') === 'on'; } catch (e) {}
const soundBtn = document.getElementById('soundBtn');
function paintSoundBtn(){
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  soundBtn.title = soundOn ? 'Blade sounds on' : 'Blade sounds off';
}
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem('blades-sound', soundOn ? 'on' : 'off'); } catch (e) {}

});
paintSoundBtn();

/* ── theme toggle (dark is the default; choice shared with legal pages) ── */
const themeBtn = document.getElementById('themeBtn');
function paintThemeBtn(){
  const dark = root.dataset.theme !== 'light';
  themeBtn.textContent = dark ? '☀️' : '🌙';

paintThemeBtn();

function swoosh(){
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(940, t + .09);
    g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0001, t + .12);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + .13);
  } catch (e) {}
}

/* ── render blades ── */
let activeBlade = 0;
try {
  const saved = parseInt(localStorage.getItem('blades-active') || '0', 10);
  if (saved >= 0 && saved < CONFIG.groups.length) activeBlade = saved;
} catch (e) {}

const bladeEls = [], allTiles = [];

CONFIG.groups.forEach((group, gi) => {
  const style = BLADE_STYLE[gi] || BLADE_STYLE[0];
  const blade = document.createElement('section');
  blade.className = 'blade' + (gi === activeBlade ? ' active' : '');
  blade.dataset.color = style.color;

  const tab = document.createElement('button');
  tab.type = 'button'; tab.className = 'blade-tab';
  tab.setAttribute('aria-label', 'Open the ' + group.title + ' blade');
  tab.innerHTML = '';
  const tn = document.createElement('span'); tn.className = 'tab-name'; tn.textContent = style.tab;
  const tc = document.createElement('span'); tc.className = 'tab-count'; tc.textContent = group.links.length + ' items';
  tab.append(tn, tc);
  tab.addEventListener('click', () => setBlade(gi, true));
  blade.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'blade-panel';
  const head = document.createElement('div');
  head.className = 'blade-head';
  head.innerHTML = '<h1></h1><p class="blade-sub"></p><div class="rule"></div>';
  head.querySelector('h1').innerHTML = '';
  const h1 = head.querySelector('h1');
  const bold = document.createElement('b'); bold.textContent = group.title;
  h1.append(document.createTextNode(style.tab === group.title ? '' : ''), bold);
  head.querySelector('.blade-sub').textContent = style.sub;
  panel.appendChild(head);

  const bodyEl = document.createElement('div');
  bodyEl.className = 'blade-body';
  const grid = document.createElement('div');
  grid.className = 'grid';

  for (const link of group.links) {
    const a = document.createElement('a');
    a.className = 'tile';
    if (link.choices && link.choices.length) a.classList.add('has-choices');
    a.href = link.url;
    a.title = link.desc ? link.url + '\n' + link.desc : link.url;
    a.dataset.name = link.name;
    a.dataset.blade = String(gi);
    let searchBlob = (group.title + ' ' + link.name + ' ' + (link.desc || '') + ' ' + link.url).toLowerCase();
    if (link.choices) for (const c of link.choices) searchBlob += ' ' + (c.label || '') + ' ' + (c.url || '');
    a.dataset.search = searchBlob;

    const text = document.createElement('span');
    text.className = 'text';
    const label = document.createElement('span');
    label.className = 'label'; label.textContent = link.name;
    text.appendChild(label);
    if (link.desc) {
      const desc = document.createElement('span');
      desc.className = 'desc'; desc.textContent = link.desc;
      text.appendChild(desc);
    }
    const chev = document.createElement('span');
    chev.className = 'chev'; chev.textContent = '›'; chev.setAttribute('aria-hidden', 'true');
    a.append(makeIcon(link), text, chev);

    a.addEventListener('click', function(e) {
      if (link.choices && link.choices.length) { e.preventDefault(); openChooser(link); return; }
      if (isAndroid && link.androidPkg) {
        e.preventDefault();
        launchAndroid(link.androidPkg, link.url, link.androidScheme, link.freshStart);
        return;
      }
      if (isAndroid && link.android) { e.preventDefault(); openUrl(link.android, link.fallback); return; }
      if (isIOS && link.ios)         { e.preventDefault(); openUrl(link.ios, link.fallback); return; }
      if (link.url.startsWith('ext+container://')) { e.preventDefault(); openUrl(link.url); }
    });
    a.addEventListener('mouseenter', () => selectTile(a, false));
    a.addEventListener('focus', () => selectTile(a, false));

    grid.appendChild(a);
    allTiles.push(a);
  }

  bodyEl.appendChild(grid);
  const empty = document.createElement('p');
  empty.className = 'empty-note';
  empty.textContent = 'Nothing on this blade matches — try another blade, or press Enter to search the web.';
  bodyEl.appendChild(empty);
  panel.appendChild(bodyEl);

  if (gi === CONFIG.groups.length - 1) {
    const foot = document.createElement('div');
    foot.className = 'blade-foot';
    foot.innerHTML = '<p class="quote">“Piracy is almost always a service problem and not a pricing problem.”<span>— Gabe Newell, co-founder of Valve</span></p>';

  bladesEl.appendChild(blade);
  bladeEls.push({ blade, tab, tc, bodyEl });

/* mobile: tabs need to sit in one row above the panels — regroup in DOM order via CSS contents */
function setBlade(i, focusFirst){
  if (i < 0) i = bladeEls.length - 1;
  if (i >= bladeEls.length) i = 0;
  activeBlade = i;
  bladeEls.forEach((b, bi) => b.blade.classList.toggle('active', bi === i));
  try { localStorage.setItem('blades-active', String(i)); } catch (e) {}
  swoosh();
  clearSelection();
  if (focusFirst) {
    const first = visibleTiles(i)[0];
    if (first) selectTile(first, false);
  }
}
function visibleTiles(bi){
  return allTiles.filter(t => Number(t.dataset.blade) === bi && !t.hidden);
}
let selectedTile = null;
function selectTile(tile, scroll){
  if (selectedTile) selectedTile.classList.remove('selected');
  selectedTile = tile;
  if (tile) {
    tile.classList.add('selected');
    if (scroll) tile.scrollIntoView({ block: 'nearest' });
  }
}
function clearSelection(){ if (selectedTile) { selectedTile.classList.remove('selected'); selectedTile = null; } }
function moveSelection(dir){
  const vis = visibleTiles(activeBlade);
  if (!vis.length) return;
  let idx = vis.indexOf(selectedTile);
  idx = idx === -1 ? (dir > 0 ? 0 : vis.length - 1) : Math.min(vis.length - 1, Math.max(0, idx + dir));
  selectTile(vis[idx], true);
}

/* ── filter / search (across all blades, like the Guide) ── */
function applyFilter(){
  const val = q.value.trim().toLowerCase();
  let first = null, firstBlade = -1;
  const counts = bladeEls.map(() => 0);
  for (const t of allTiles) {
    const hit = !val || t.dataset.search.includes(val);
    t.hidden = !hit;
    if (hit) { counts[Number(t.dataset.blade)]++; if (!first) { first = t; firstBlade = Number(t.dataset.blade); } }
  }
  bladeEls.forEach((b, bi) => {
    b.bodyEl.classList.toggle('no-matches', !!val && counts[bi] === 0);
    b.tc.textContent = val ? counts[bi] + ' match' + (counts[bi] === 1 ? '' : 'es') : CONFIG.groups[bi].links.length + ' items';
    b.tc.classList.toggle('zero', !!val && counts[bi] === 0);
  });
  if (val && first && counts[activeBlade] === 0) setBlade(firstBlade, false);
  if (val && first) selectTile(first, false);
  hintEl.textContent = val
    ? (first ? '↵  ' + first.dataset.name + '  ·  ' + counts.reduce((a, c) => a + c, 0) + ' match' + (counts.reduce((a, c) => a + c, 0) === 1 ? '' : 'es') : '↵  Search the web for “' + q.value.trim() + '”')
    : '';
}
q.addEventListener('input', applyFilter);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = allTiles.find(t => !t.hidden);
    if (first) { setBlade(Number(first.dataset.blade), false); first.click(); return; }
    const val = q.value.trim();
    if (val) location.href = CONFIG.search + encodeURIComponent(val);
  }
  if (e.key === 'Escape') { q.value = ''; applyFilter(); q.blur(); }
});

/* ── keyboard navigation: arrows = D-pad, Q/E & [ ] = bumpers ── */
document.addEventListener('keydown', e => {
  const typing = document.activeElement === q;
  if (!chooserEl.hidden) return; // chooser has its own Esc handling
  if (typing) {
    if (e.key === 'ArrowDown') { e.preventDefault(); q.blur(); moveSelection(1); }
    return;
  }
  switch (e.key) {
    case '/': e.preventDefault(); q.focus(); q.select(); break;
    case 'ArrowRight': e.preventDefault(); setBlade(activeBlade + 1, true); break;
    case 'ArrowLeft':  e.preventDefault(); setBlade(activeBlade - 1, true); break;
    case 'ArrowDown':  e.preventDefault(); moveSelection(gridCols()); break;
    case 'ArrowUp':    e.preventDefault(); moveSelection(-gridCols()); break;
    case 'Enter': if (selectedTile) { e.preventDefault(); selectedTile.click(); } break;
    case 'Escape': clearSelection(); break;
    default:
      if (e.key === 'q' || e.key === '[') { e.preventDefault(); setBlade(activeBlade - 1, true); }
      if (e.key === 'e' || e.key === ']') { e.preventDefault(); setBlade(activeBlade + 1, true); }
  }
});
function gridCols(){
  const grid = bladeEls[activeBlade].bodyEl.querySelector('.grid');
  if (!grid) return 1;
  const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
  return Math.max(1, cols);
}

/* ── gamepad: D-pad / sticks switch blades, A opens, B clears ── */
let padState = {}, padTimer = null;
window.addEventListener('gamepadconnected', () => {
  if (padTimer) return;
  padTimer = setInterval(() => {
    const gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(Boolean);
    if (!gp) return;
    const pressed = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const edge = (name, down) => { const was = padState[name]; padState[name] = down; return down && !was; };
    if (edge('rb', pressed(5))) setBlade(activeBlade + 1, true);
    if (edge('lb', pressed(4))) setBlade(activeBlade - 1, true);
    if (edge('right', pressed(15))) setBlade(activeBlade + 1, true);
    if (edge('left', pressed(14))) setBlade(activeBlade - 1, true);
    if (edge('down', pressed(13))) moveSelection(gridCols());
    if (edge('up', pressed(12))) moveSelection(-gridCols());
    if (edge('a', pressed(0)) && selectedTile && chooserEl.hidden) selectedTile.click();
    if (edge('b', pressed(1))) { if (!chooserEl.hidden) closeChooser(); else clearSelection(); }
    const ax = gp.axes[0] || 0;
    if (edge('axr', ax > .6)) setBlade(activeBlade + 1, true);
    if (edge('axl', ax < -.6)) setBlade(activeBlade - 1, true);
  }, 90);
});

/* ── swipe between blades (touch) ── */
let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 70 && window.innerWidth > 860) setBlade(activeBlade + (dx < 0 ? 1 : -1), true);
}, { passive: true });

/* ── clock ── */
function tick(){
  const d = new Date();
  timeEl.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  dateEl.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
tick();
setInterval(tick, 10000);


/* ── boot intro: once per session, skippable, motion-safe ── */
(function bootIntro(){
  const bootEl = document.getElementById('boot');
  if (!bootEl) return;
  let played = false;
  try { played = sessionStorage.getItem('blades-booted') === '1'; } catch (e) {}
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (played || reduceMotion) { bootEl.remove(); return; }
  try { sessionStorage.setItem('blades-booted', '1'); } catch (e) {}
  let ended = false;
  function endBoot(){
    if (ended) return; ended = true;
    bootEl.classList.add('done');
    const st = document.querySelector('.stage');
    if (st) st.classList.add('enter');
    setTimeout(() => bootEl.remove(), 600);
  }
  setTimeout(endBoot, 2350);
  bootEl.addEventListener('click', endBoot);
  document.addEventListener('keydown', function bk(){ endBoot(); document.removeEventListener('keydown', bk); });
})();

/* select the first tile of the opening blade */
const firstTile = visibleTiles(activeBlade)[0];
