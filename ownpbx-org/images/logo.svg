<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 144" role="img" aria-label="OwnPBX.org">
  <title>OwnPBX.org</title>
  <!-- Dark pill badge: reads on light, dark, and gradient headers -->
  <rect x="2" y="6" width="556" height="132" rx="66" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Phone handset: gentle ringing rock -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 66 78; 3 66 78; -3 66 78" dur="1.4s" repeatCount="indefinite"/>
    <rect x="30" y="26" width="72" height="104" rx="16" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <rect x="54" y="38" width="24" height="5" rx="2.5" fill="#FFFFFF" opacity="0.8"/>
    <rect x="40" y="50" width="52" height="52" rx="8" fill="#FFFFFF" opacity="0.08"/>
    <!-- sound bars on the screen -->
    <rect x="52" y="72" width="7" height="18" rx="3.5" fill="#FF8A3D">
      <animate attributeName="height" values="18;30;18" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="72;66;72" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="64" y="66" width="7" height="30" rx="3.5" fill="#FF8A3D">
      <animate attributeName="height" values="30;16;30" dur="1.2s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="66;73;66" dur="1.2s" begin="0.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="76" y="72" width="7" height="18" rx="3.5" fill="#FF8A3D">
      <animate attributeName="height" values="18;26;18" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="72;68;72" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="56" y="116" width="20" height="5" rx="2.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Outgoing signal waves, staggered ripple -->
  <g fill="none" stroke="#FF8A3D" stroke-width="6" stroke-linecap="round">
    <path d="M 118 54 Q 136 78 118 102" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 6 0" dur="1.8s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M 132 42 Q 158 78 132 114" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.25s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 6 0" dur="1.8s" begin="0.25s" repeatCount="indefinite"/>
    </path>
    <path d="M 146 30 Q 180 78 146 126" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 6 0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Wordmark -->
  <text x="196" y="92" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="#FFFFFF">OwnPBX<tspan fill="#FF8A3D">.org</tspan></text>
</svg>
