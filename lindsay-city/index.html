<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lindsay.City</title>
<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --dusk-deep: #142B36;
    --dusk-mid: #3C6873;
    --horizon: #F2A65A;
    --sun-gold: #FFC857;
    --mtn-far: #5C7A89;
    --mtn-near: #33505D;
    --pine-dark: #17281F;
    --pine-mid: #23392B;
    --dirt: #6B4423;
    --dirt-light: #8B5A2B;
    --cream: #F4EDE4;
    --cream-dim: rgba(244,237,228,0.78);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--dusk-deep);
    overflow-x: hidden;
  }

  .scene {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .scene svg.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.5rem 4rem;
    text-align: center;
    animation: rise 1.1s ease-out both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    margin-bottom: 0.9rem;
  }

  .brand img {
    height: 48px;
    width: auto;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
  }

  .brand span {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 1.9rem;
    color: var(--cream);
    letter-spacing: 0.02em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
  }

  .tagline {
    color: var(--cream-dim);
    font-size: 1.08rem;
    font-weight: 400;
    max-width: 30ch;
    line-height: 1.5;
    margin-bottom: 3.2rem;
  }

  .forks {
    display: flex;
    gap: 3.5rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  .sign-link {
    text-decoration: none;
    display: block;
  }

  .sign {
    --tilt: -3deg;
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 1.1rem 1.9rem 1.1rem 1.6rem;
    background: linear-gradient(160deg, #7A4F2C 0%, #5E3A1E 55%, #4A2C16 100%);
    border-radius: 6px 22px 6px 6px;
    box-shadow:
      0 10px 22px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.12),
      inset 0 -3px 6px rgba(0,0,0,0.35);
    transform: rotate(var(--tilt));
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    border: 1px solid rgba(0,0,0,0.35);
  }

  .sign::before {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px dashed rgba(244,237,228,0.18);
    border-radius: 4px 18px 4px 4px;
    pointer-events: none;
  }

  .sign-link:nth-child(2) .sign { --tilt: 2.5deg; }

  .sign-link:hover .sign,
  .sign-link:focus-visible .sign {
    transform: rotate(0deg) translateY(-3px);
    box-shadow:
      0 16px 28px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -3px 6px rgba(0,0,0,0.35);
  }

  .sign-link:focus-visible .sign {
    outline: 2px solid var(--sun-gold);
    outline-offset: 3px;
  }

  .sign .icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }

  .sign .icon img { width: 100%; height: 100%; object-fit: contain; }

  .sign .label {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--cream);
    text-shadow: 0 1px 0 rgba(0,0,0,0.5), 0 -1px 0 rgba(255,255,255,0.06);
    line-height: 1.15;
    text-align: left;
    white-space: nowrap;
  }

  .sign .label small {
    display: block;
    font-family: 'Inter', sans-serif;
    text-transform: none;
    font-weight: 400;
    letter-spacing: 0;
    font-size: 0.72rem;
    color: var(--cream-dim);
    margin-top: 0.15rem;
  }

  .post {
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    width: 10px;
    height: 42px;
    background: linear-gradient(90deg, #4A2C16, #2E1B0D 50%, #4A2C16);
    border-radius: 0 0 3px 3px;
  }

  @media (max-width: 620px) {
    .forks { flex-direction: column; gap: 2.2rem; }
    .sign { padding: 1rem 1.6rem; }
  }

  .footnote {
    position: relative;
    z-index: 5;
    color: var(--cream-dim);
    font-size: 0.8rem;
    padding-bottom: 1.6rem;
    text-align: center;
  }

  .footnote a { color: var(--horizon); text-decoration: none; }
  .footnote a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .content { animation: none; }
    .sign { transition: none; }
  }
</style>
</head>
<body>

<div class="scene">
  <svg class="bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#142B36"/>
        <stop offset="45%" stop-color="#2E5560"/>
        <stop offset="78%" stop-color="#4E7A7C"/>
        <stop offset="100%" stop-color="#F2A65A"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFE9B0" stop-opacity="0.9"/>
        <stop offset="45%" stop-color="#FFC857" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#FFC857" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6E8B95"/>
        <stop offset="100%" stop-color="#537480"/>
      </linearGradient>
      <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3D5C68"/>
        <stop offset="100%" stop-color="#2C4652"/>
      </linearGradient>
      <linearGradient id="trailGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8B5A2B"/>
        <stop offset="100%" stop-color="#5A3A1C"/>
      </linearGradient>
    </defs>

    <!-- sky -->
    <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

    <!-- sun with soft glow -->
    <circle cx="1150" cy="230" r="230" fill="url(#sunGlow)"/>
    <circle cx="1150" cy="230" r="62" fill="#FFDD8A"/>

    <!-- rain cloud, upper left, subtle streaks -->
    <g opacity="0.85">
      <ellipse cx="270" cy="160" rx="140" ry="42" fill="#5C7078"/>
      <ellipse cx="360" cy="175" rx="95" ry="34" fill="#516670"/>
      <g stroke="#C7D2D4" stroke-width="3" stroke-linecap="round" opacity="0.45">
        <line x1="230" y1="205" x2="205" y2="270"/>
        <line x1="270" y1="210" x2="248" y2="278"/>
        <line x1="312" y1="208" x2="290" y2="272"/>
        <line x1="355" y1="212" x2="335" y2="268"/>
      </g>
    </g>

    <!-- soft clouds -->
    <g fill="#F4EDE4" opacity="0.55">
      <ellipse cx="760" cy="120" rx="110" ry="28"/>
      <ellipse cx="830" cy="132" rx="80" ry="24"/>
      <ellipse cx="690" cy="135" rx="70" ry="20"/>
    </g>
    <g fill="#F4EDE4" opacity="0.4">
      <ellipse cx="1350" cy="360" rx="90" ry="22"/>
      <ellipse cx="1410" cy="370" rx="60" ry="18"/>
    </g>

    <!-- far mountains -->
    <path d="M0,480 L120,380 L230,450 L340,340 L470,470 L600,370 L740,460 L860,360 L1000,470 L1140,390 L1280,470 L1420,380 L1600,460 L1600,600 L0,600 Z" fill="url(#mtnFar)" opacity="0.75"/>

    <!-- near mountains -->
    <path d="M0,560 L150,430 L280,540 L420,410 L560,550 L720,440 L880,560 L1040,450 L1200,560 L1360,460 L1600,550 L1600,650 L0,650 Z" fill="url(#mtnNear)"/>

    <!-- tree line silhouette -->
    <g fill="#1B2E22">
      <path d="M40,650 L70,580 L100,650 Z"/>
      <path d="M85,660 L120,570 L155,660 Z"/>
      <path d="M140,655 L168,590 L196,655 Z"/>
      <path d="M1420,655 L1450,575 L1480,655 Z"/>
      <path d="M1465,660 L1500,570 L1535,660 Z"/>
      <path d="M1510,650 L1538,585 L1566,650 Z"/>
    </g>

    <!-- ground -->
    <rect x="0" y="640" width="1600" height="260" fill="#233A2A"/>
    <rect x="0" y="640" width="1600" height="30" fill="#2C4633"/>

    <!-- pine clusters, foreground, both corners -->
    <g fill="#17281F">
      <path d="M-20,900 L40,700 L100,900 Z"/>
      <path d="M30,900 L110,660 L190,900 Z"/>
      <path d="M150,900 L210,720 L270,900 Z"/>
      <path d="M1330,900 L1390,720 L1450,900 Z"/>
      <path d="M1410,900 L1490,660 L1570,900 Z"/>
      <path d="M1500,900 L1560,700 L1620,900 Z"/>
    </g>
    <g fill="#23392B">
      <path d="M20,900 L75,740 L130,900 Z"/>
      <path d="M1470,900 L1525,740 L1580,900 Z"/>
    </g>

    <!-- dirt trail forking up the middle -->
    <path d="M700,900 C690,780 660,720 620,660 C590,610 610,560 660,540 L700,560 C660,590 650,630 680,670 C720,720 745,780 760,900 Z" fill="url(#trailGrad)"/>
    <path d="M760,900 C775,780 800,720 840,660 C870,610 850,560 800,540 L760,560 C800,590 810,630 780,670 C740,720 715,780 700,900 Z" fill="url(#trailGrad)" opacity="0.92"/>

    <!-- tire tracks -->
    <g stroke="#3E2711" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round">
      <path d="M712,895 C705,780 682,715 648,662 C625,624 636,585 668,556" stroke-dasharray="2 10"/>
      <path d="M748,895 C752,780 772,715 802,662 C822,624 812,585 782,556" stroke-dasharray="2 10"/>
    </g>
  </svg>

  <div class="content">
    <div class="brand">
      <img src="assets/LWT.png" alt="">
      <span>Lindsay.City</span>
    </div>
    <p class="tagline">Two trails, one town. Where do you want to explore?</p>

    <div class="forks">
      <a class="sign-link" href="https://www.youtube.com/@LindsayCity" target="_blank" rel="noopener noreferrer">
        <div class="sign">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="#F4EDE4"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg>
          </span>
          <span class="label">Watch my Videos<small>E-Biking Adventures</small></span>
        </div>
      </a>
      <a class="sign-link" href="main.html">
        <div class="sign">
          <span class="icon">
            <img src="assets/LWT.png" alt="">
          </span>
          <span class="label">Main Site<small>Lindsay.City</small></span>
        </div>
      </a>
    </div>
  </div>

  <p class="footnote">Lindsay.City is an independent site and is not affiliated with the <a href="https://www.lindsay.ca.us/" target="_blank" rel="noopener noreferrer">City of Lindsay</a>.</p>
</div>

</body>
</html>
