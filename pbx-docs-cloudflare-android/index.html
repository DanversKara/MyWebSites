<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Instantly tells the browser to fetch the new page -->
    <meta http-equiv="refresh" content="0;url=https://docs.ownpbx.org">
    <title>Redirecting...</title>
    
    <!-- JavaScript fallback for even faster execution if parsed first -->
    <script>
        window.location.replace("https://docs.ownpbx.org");
    </script>
</head>
<body>
    <p>If you are not redirected automatically, follow this <a href="docs.ownpbx.org">WE"VE MOVED TO</a> https://docs.ownpbx.org</p>
</body>
</html>
